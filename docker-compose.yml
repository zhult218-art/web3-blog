services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-web3_portal}
    ports:
      - '3306:3306'
    volumes:
      - ./backend/deploy/mysql/init:/docker-entrypoint-initdb.d
    restart: always

  redis:
    image: redis:7.0-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}"]
    ports:
      - '6379:6379'
    restart: always

  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS required}
    ports:
      - '5672:5672'
      - '15672:15672'
    restart: always

  gateway:
    build:
      context: ./backend/gateway
    ports:
      - '8080:8080'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - mysql
      - redis
    restart: always

  user-service:
    build:
      context: ./backend/user-service
    ports:
      - '8081:8081'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - mysql
      - redis
    restart: always

  blog-service:
    build:
      context: ./backend/blog-service
    ports:
      - '8082:8082'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - mysql
      - redis
    restart: always

  forum-service:
    build:
      context: ./backend/forum-service
    ports:
      - '8083:8083'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - mysql
      - redis
    restart: always

  shop-service:
    build:
      context: ./backend/shop-service
    ports:
      - '8084:8084'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - mysql
      - redis
    restart: always

  media-service:
    build:
      context: ./backend/media-service
    ports:
      - '8085:8085'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - mysql
      - redis
    restart: always

  quant-service:
    build:
      context: ./backend/quant-service
    ports:
      - '8086:8086'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - mysql
      - redis
    restart: always

  tool-service:
    build:
      context: ./backend/tool-service
    ports:
      - '8087:8087'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - mysql
      - redis
    restart: always

  software-service:
    build:
      context: ./backend/software-service
    ports:
      - '8088:8088'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - mysql
      - redis
    restart: always

  resource-service:
    build:
      context: ./backend/resource-service
    ports:
      - '8089:8089'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - mysql
      - redis
    volumes:
      - ./backend/resource-service/runtime:/app/runtime
    restart: always

  jarvis-service:
    build:
      context: ./backend/jarvis-service
    ports:
      - '9001:9001'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      - mysql
      - redis
      - rabbitmq
    restart: always

  admin-service:
    build:
      context: ./backend/admin-service
    ports:
      - '9002:9002'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - mysql
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - '80:80'
    depends_on:
      - gateway
    restart: always
