# =====================================================================
# Web3 Portal — Docker Compose
# 2026-09-17 修订（与体检报告 P0-3 对齐）：
#   1. 补充 nacos / ai-proxy-service / quant-py-service 三个缺失服务定义；
#   2. 所有 Java 服务的 *_SERVICE_HOST 环境变量统一指向对应容器名，
#      与 gateway/application.yml 的 ${XXX_SERVICE_HOST:localhost} 占位一一对应；
#      —— 修复网关路由全部 502 的根因（容器内服务发现失败）。
#   3. 注入 JWT_SECRET 环境变量（强制，缺失则服务启动 fail-fast）；
#   4. 删除 user/blog/forum/shop/media/quant/tool/software/resource/jarvis/admin
#      十一个业务服务的宿主机端口映射——只保留 gateway 8080 与 frontend 80，
#      防止绕过网关直连服务端口；外部调试可通过 `docker compose exec` 进入容器。
#   5. 变量名统一为 NACOS_SERVER（与代码读取一致），不再用 NACOS_SERVER_ADDR。
#   6. 移除 SPRING_PROFILES_ACTIVE=dev（仓库无 application-dev.yml，会导致 Nacos
#      配置客户端按 dev profile 加载而失败；默认 profile 即可）。
# =====================================================================
#
# 2026-10-16 修订（部署配置修正）：
#   1. quant-py-service → py-service：构建上下文改指 ./py-service（原目录不存在），
#      并补 Dockerfile、注入 Nacos/MySQL/JWT 环境变量；
#   2. 新增 node-service 两个容器：netease-music-api(3000)、chat-gateway(3010)，
#      网关/前端依赖同步补齐（此前音乐馆与聊天在生产 compose 下无上游）；
#   3. gateway 注入 PY_SERVICE_HOST / NETEASE_API_HOST（否则容器内落到 localhost → 502）；
#   4. software-service 健康检查端口 8088 → 8090（与代码及网关路由默认一致）；
#   5. 基础设施端口（mysql/redis/rabbitmq/nacos）改为仅绑定 127.0.0.1。
# =====================================================================

# 公共环境锚点（YAML anchor，mapping 格式以支持 << 合并键）
x-java-env: &java-env
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
  MYSQL_HOST: ${MYSQL_HOST:-mysql}
  MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
  # 网关路由用 ${XXX_SERVICE_HOST:localhost}，统一指向容器名
  USER_SERVICE_HOST: user-service
  BLOG_SERVICE_HOST: blog-service
  FORUM_SERVICE_HOST: forum-service
  SHOP_SERVICE_HOST: shop-service
  MEDIA_SERVICE_HOST: media-service
  QUANT_SERVICE_HOST: quant-service
  TOOL_SERVICE_HOST: tool-service
  SOFTWARE_SERVICE_HOST: software-service
  RESOURCE_SERVICE_HOST: resource-service
  JARVIS_SERVICE_HOST: jarvis-service
  ADMIN_SERVICE_HOST: admin-service
  AI_PROXY_SERVICE_HOST: ai-proxy-service
  # forum-service 在线成员查询走 chat-gateway（容器内用服务名，避免落到 localhost）
  CHAT_GATEWAY_URL: http://chat-gateway:3010
  J8Y_APP_KEY: ${J8Y_APP_KEY:-}
  SHOWAPI_APP_KEY: ${SHOWAPI_APP_KEY:-}

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-web3_portal}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - ./backend/deploy/mysql/init:/docker-entrypoint-initdb.d
    # WARNING: Do not expose these ports in production
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7.0-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}"]
    # WARNING: Do not expose these ports in production
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS required}
    ports:
      - '127.0.0.1:5672:5672'
      # WARNING: Do not expose these ports in production
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: always

  nacos:
    image: nacos/nacos-server:v2.3.2-slim
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - '127.0.0.1:8848:8848'
      # WARNING: Do not expose these ports in production
      - '127.0.0.1:9848:9848'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: always

  gateway:
    build:
      context: ./backend/gateway
    ports:
      - '8080:8080'
    environment:
      <<: *java-env
      # 网关路由用 ${PY_SERVICE_HOST:localhost} / ${NETEASE_API_HOST:localhost}，
      # 不注入会解析到容器内 localhost（/api/quant、/netease 等路由全部 502）
      PY_SERVICE_HOST: py-service
      NETEASE_API_HOST: netease-music-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      netease-music-api:
        condition: service_started
    restart: always

  user-service:
    build:
      context: ./backend/user-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: always

  blog-service:
    build:
      context: ./backend/blog-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: always

  forum-service:
    build:
      context: ./backend/forum-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: always

  shop-service:
    build:
      context: ./backend/shop-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: always

  media-service:
    build:
      context: ./backend/media-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: always

  quant-service:
    build:
      context: ./backend/quant-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: always

  tool-service:
    build:
      context: ./backend/tool-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: always

  software-service:
    build:
      context: ./backend/software-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: always

  resource-service:
    build:
      context: ./backend/resource-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    volumes:
      - ./backend/resource-service/runtime:/app/runtime
    restart: always

  jarvis-service:
    build:
      context: ./backend/jarvis-service
    environment:
      <<: *java-env
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: always

  admin-service:
    build:
      context: ./backend/admin-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: always

  ai-proxy-service:
    build:
      context: ./backend/ai-proxy-service
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    restart: always

  py-service:
    build:
      context: ./py-service
    environment:
      # 统一 Python 服务（FastAPI，9006）：Nacos 注册 + 数据库 + JWT 鉴权
      - NACOS_SERVER=${NACOS_SERVER:-nacos:8848}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      - QUANT_DATA_DIR=/app/data
      - QUANT_OUTPUT_DIR=/app/output
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
    depends_on:
      - mysql
    restart: always

  # 网易云音乐 API 代理（Node 封装 NeteaseCloudMusicApi，端口 3000）
  # 网关 /netease/** 路由的上游；NETEASE_* 开放平台凭证可不配（缺省仅 /ext/* 不可用）
  netease-music-api:
    build:
      context: ./node-service/netease-music-api
    environment:
      NETEASE_APP_ID: ${NETEASE_APP_ID:-}
      NETEASE_APP_SECRET: ${NETEASE_APP_SECRET:-}
      NETEASE_PUBKEY: ${NETEASE_PUBKEY:-}
      NETEASE_PRIVATE_KEY: ${NETEASE_PRIVATE_KEY:-}
    restart: always

  # 聊天网关（Socket.IO v4，端口 3010）：httpOnly Cookie JWT 鉴权 + MySQL 持久化，
  # 前端 nginx /socket.io 直连本服务；配置 Redis 后自动升级为 PubSub 集群广播
  chat-gateway:
    build:
      context: ./node-service/chat-gateway
    environment:
      CHAT_GATEWAY_PORT: "3010"
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - '80:80'
    depends_on:
      - gateway
      - py-service
      - chat-gateway
    restart: always
