# Web3 Portal CI — lint + build + 单元测试
# 2026-09-17 新增；2026-10-16 修订：后端改为 mvn test（24 个单元测试全部 Mockito，
# 无需 DB/中间件），修复此前 -DskipTests -Dmaven.test.skip=true 导致测试编译错误也进不了 CI。
# 触发：push / pull_request 到 main/master。
#   1. frontend lint（ESLint）
#   2. frontend build（vite build，验证无 import 错误）
#   3. backend maven test（编译 + 单元测试）
# 失败时阻断 PR 合入。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
        continue-on-error: true # 历史代码大量 warn，先不阻断
      - name: Build
        run: npm run build

  backend:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Maven test (compile + unit tests)
        run: mvn -B -q test
