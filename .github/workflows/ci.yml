# Web3 Portal CI
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Lint changed frontend source files
        shell: bash
        run: |
          files="$(git diff --name-only origin/main...HEAD -- frontend | grep -E '\.(vue|js|ts)$' || true)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs -r npx eslint
          else
            echo "No changed frontend source files; full production build remains required."
          fi
      - name: Production build
        run: npm run build

  backend:
    name: Backend Maven Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend unit tests
        run: mvn -B -q -f backend/pom.xml test

  python:
    name: Python Service Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile Python sources
        run: find main.py core modules tests -type f -name '*.py' ! -path 'modules/wifi/vendor/wifite/*' -print0 | xargs -0 -n1 python -m py_compile
      - name: Run focused tests
        run: python -m pytest -q tests

  compose:
    name: Compose Configuration and Image Build
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-that-is-long-enough
      MYSQL_ROOT_PASSWORD: ci-only-mysql-password
      MYSQL_PASSWORD: ci-only-mysql-password
      REDIS_PASSWORD: ci-only-redis-password
      RABBITMQ_DEFAULT_USER: ci
      RABBITMQ_DEFAULT_PASS: ci-only-rabbit-password
      RABBITMQ_USERNAME: ci
      RABBITMQ_PASSWORD: ci-only-rabbit-password
      VIDEO_ADMIN_TOKEN: ci-only-video-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package backend jars for Dockerfiles
        run: mvn -B -q -f backend/pom.xml -Dmaven.test.skip=true package
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build complete application image set
        run: docker compose build
      - name: Start integration smoke-test services
        run: docker compose up -d --no-build mysql redis nacos user-service gateway py-service frontend
      - name: Verify MySQL schema initialization
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T mysql mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -Nse "SELECT COUNT(*) FROM web3_user.user; SELECT COUNT(*) FROM web3_user.guild; SELECT COUNT(*) FROM web3_tool.site_share;"; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify Redis readiness and authentication
        run: docker compose exec -T redis redis-cli -a "$REDIS_PASSWORD" ping | grep -qx PONG
      - name: Verify Nacos readiness
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8848/nacos/v1/console/health/readiness; then
              echo "Nacos readiness: OK"
              exit 0
            fi
            sleep 2
          done
          docker compose ps nacos
          docker compose logs --no-color --tail=200 nacos
          exit 1
      - name: Verify frontend and Nginx to Python route
        shell: bash
        run: |
          sleep 10
          curl --retry 20 --retry-connrefused --retry-delay 2 --fail --max-time 15 http://127.0.0.1/ -o /dev/null
          status=$(curl --silent --show-error --max-time 20 -o /tmp/py-health.json -w '%{http_code}' http://127.0.0.1/pyquant/health)
          case "$status" in 200|503) ;; *) echo "Unexpected Nginx -> py-service status: $status"; exit 1 ;; esac
          python -c 'import json; data=json.load(open("/tmp/py-health.json")); names={m["name"] for m in data.get("modules", [])}; assert {"quant", "cockpit"}.issubset(names), (names, data.get("unhealthy_modules")); print("Nginx -> py-service route and critical module discovery: OK")'
      - name: Verify Python aggregate module health
        run: |
          docker compose exec -T py-service python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          try:
              with urllib.request.urlopen("http://127.0.0.1:9006/health", timeout=10) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              payload = json.loads(error.read())
              print(json.dumps(payload, ensure_ascii=False))
              raise SystemExit(f"Python aggregate health returned HTTP {error.code}")
          print(json.dumps(payload, ensure_ascii=False))
          assert payload.get("ok") is True and not payload.get("unhealthy_modules"), payload
          PY
      - name: Verify Nginx to Gateway to User Service
        shell: bash
        run: |
          curl --retry 60 --retry-all-errors --retry-connrefused --retry-delay 2 --fail http://127.0.0.1/api/user/captcha -o /tmp/captcha-response.json
          python -c 'import json; data=json.load(open("/tmp/captcha-response.json")); assert data.get("code", 200) in (0, 200); print("Nginx -> Gateway -> User Service route: OK")'
      - name: Show service diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100 mysql redis nacos user-service gateway py-service frontend
