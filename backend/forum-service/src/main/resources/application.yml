spring:
  application:
    name: forum-service
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        fail-fast: false
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        fail-fast: false
        file-extension: yaml
        import-check:
        enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/web3_forum?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
server:
  port: 8083
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
logging:
  level:
    com.web3.forum: debug

# 本地上传目录（图片/群相册）
app:
  upload:
    dir: ${app_upload_dir:./uploads}
