spring:
  application:
    name: media-service
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        fail-fast: false
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        fail-fast: false
        file-extension: yaml
        import-check:
        enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/web3_media?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
server:
  port: 8085
media:
  upload:
    dir: runtime/uploads
    max-size: 524288000
  download:
    # yt-dlp / ffmpeg / ffprobe 可执行文件路径（根 .env 的 YTDLP_PATH / FFMPEG_PATH / FFPROBE_PATH）
    ytdlp-path: ${YTDLP_PATH:yt-dlp}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    # 下载代理（YouTube 等站点需要）；留空表示直连。复用 .env 中的 HTTPS_PROXY
    proxy: ${MEDIA_DOWNLOAD_PROXY:}
    # 单个任务最长下载时间（分钟）与并发任务数
    timeout-minutes: 30
    concurrency: 2
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
logging:
  level:
    com.web3.media: debug
