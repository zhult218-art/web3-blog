spring:
  application:
    name: shop-service
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        fail-fast: false
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        fail-fast: false
        file-extension: yaml
        import-check:
          enabled: false
  config:
    import: optional:nacos:${spring.application.name}.yaml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/web3_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}

server:
  port: 8084

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 支付平台配置（凭证从环境变量注入；未配置时 PayConfig 标志位为 false，调用支付接口返回 503）
# 回调 URL 必须公网可达，本项目复用 SakuraFrp 隧道：https://frp-six.com:44598/api/pay/notify/{alipay|wechat}
pay:
  alipay:
    app-id: ${ALIPAY_APPID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway: ${ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}
    notify-url: ${ALIPAY_NOTIFY_URL:}
    return-url: ${ALIPAY_RETURN_URL:}
    sign-type: ${ALIPAY_SIGN_TYPE:RSA2}
  wechat:
    app-id: ${WECHAT_APPID:}
    mch-id: ${WECHAT_MCHID:}
    api-v3-key: ${WECHAT_APIV3_KEY:}
    cert-serial-no: ${WECHAT_CERT_SERIAL_NO:}
    private-key: ${WECHAT_PRIVATE_KEY:}
    notify-url: ${WECHAT_NOTIFY_URL:}

logging:
  level:
    com.web3.shop: debug
