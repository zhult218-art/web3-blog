# 2026-09-17 修订（与体检报告 P0-4 对齐）：
#   1. 补 /pyquant 代理到 quant-py-service（量化页 404 修复）；
#   2. 补 /whisper 代理到 jarvis-service:9011（语音助手页 404 修复）；
#   3. 开启 gzip，压缩 JS/CSS/JSON/HTML，降低前端 ~3.5MB 包体的传输量。
#   4. 注意 py-service 是容器内服务名，与 docker-compose.yml 中的服务名一致
#      （2026-10-16：上游已由 quant-py-service 更名为 py-service，/whisper 亦改指 py-service）。
#
# 2026-09-20 修订：补齐与 vite.config.js dev 代理的差距。
#   此前只有 dev 环境配了 /vr、/sixty、/itunes-audio，生产 nginx 没有，
#   导致上线后量化 AI 对话、工具中心 60s API、音乐馆试听三处全部 404。
#   这三个上游都不保证存在（/vr 是独立部署的扩展服务，另两个是公网域名），
#   因此统一用「resolver + 变量 proxy_pass」把 DNS 解析推迟到请求时：
#   若上游缺失只返回 502，而不是让 nginx 启动阶段解析失败、整个容器起不来。
#
# 2026-10-16 修订（与 vite.config.js 全面对齐）：
#   1. /pyquant 上游由 quant-py-service 改为 py-service（compose 服务同名，端口 9006）；
#   2. /whisper 上游由已不存在的 jarvis-service:9011 改为 py-service:9006 + /api/whisper 重写；
#   3. 补齐 /socket.io、/uploads、/photo、/qzapi、/wifiapi、/osintapi、/voiceapi、/cockpit
#      八个代理——此前仅 dev 环境有，生产同源访问全部 404。

server {
  listen 80;
  server_name localhost;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # gzip 压缩配置
  gzip on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    image/svg+xml;
  gzip_vary on;
  gzip_proxied any;

  # 静态资源缓存（Vite 产物带 hash，可长缓存）
  location /assets/ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location /api {
    proxy_pass http://gateway:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # 量化数据服务（统一 py-service 的 quant 模块，端口 9006）
  location /pyquant/ {
    proxy_pass http://py-service:9006/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE 长连接支持
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # 语音识别服务（统一 py-service 的 whisper 模块，端口 9006；与 vite dev 重写一致）
  location /whisper/ {
    proxy_pass http://py-service:9006/api/whisper/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # 聊天实时通道（Socket.IO 网关 chat-gateway:3010，与 vite dev 的 '/socket.io' 代理一致）
  # 长轮询 → WebSocket 自动升级，故 http/1.1 + Upgrade 头必须放行
  location /socket.io/ {
    proxy_pass http://chat-gateway:3010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }

  # 聊天图片/群相册等上传静态资源（forum-service 直接托管，路径原样透传）
  location /uploads/ {
    proxy_pass http://forum-service:8083;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # 相册/媒体文件（photo.url 为 /photo/file/{name}，不带 /api，经网关转发 media-service）
  location /photo/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # 时光回溯 QQ 空间备份（统一 py-service 9006 的 qzone 模块）
  # /qzapi/xxx → /api/qzone/xxx（与 vite dev 的 /qzapi 重写一致）
  location /qzapi/ {
    proxy_pass http://py-service:9006/api/qzone/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # WiFi 安全审计（统一 py-service 9006 的 wifi 模块；ws 用于实时日志）
  # /wifiapi/xxx → /api/wifi/xxx
  location /wifiapi/ {
    proxy_pass http://py-service:9006/api/wifi/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # OSINT 信息收集（统一 py-service 9006 的 osint 模块；ws 用于实时扫描日志）
  # /osintapi/xxx → /api/osint/xxx
  location /osintapi/ {
    proxy_pass http://py-service:9006/api/osint/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # 星图助手语音全双工（统一 py-service 9006 的 voice 模块；网关无 WS 路由，必须直连）
  # /voiceapi/xxx → /api/voice/xxx
  location /voiceapi/ {
    proxy_pass http://py-service:9006/api/voice/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # 市场驾驶舱（统一 py-service 9006 的 cockpit 模块，静态资源 + API 均不剥离前缀）
  location /cockpit/ {
    proxy_pass http://py-service:9006;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # ── 以下三个上游用变量形式 proxy_pass，把 DNS 解析推迟到请求时 ──
  # Docker 内置 DNS；valid=30s 表示解析结果缓存 30 秒
  resolver 127.0.0.11 valid=30s ipv6=off;

  # 量化 AI 对话（Vibe-Research 扩展服务，独立部署，端口 8900）
  # 对应 vite dev 的 '/vr' → '/api' 重写：/vr/chat → /api/chat
  location /vr/ {
    set $vr_upstream http://vr-service:8900;
    rewrite ^/vr/(.*)$ /api/$1 break;
    proxy_pass $vr_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # NDJSON 流式响应，必须关闭缓冲
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # 60s API 公共实例（工具中心「每天60秒读懂世界」等）
  location /sixty/ {
    set $sixty_upstream https://60s.viki.moe;
    rewrite ^/sixty/(.*)$ /$1 break;
    proxy_pass $sixty_upstream;
    proxy_set_header Host 60s.viki.moe;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_ssl_server_name on;
    proxy_read_timeout 60s;
  }

  # iTunes 试听音频同源代理（跨域音频接入 Web Audio 会静音，必须同源）
  location /itunes-audio/ {
    set $itunes_upstream https://audio-ssl.itunes.apple.com;
    rewrite ^/itunes-audio/(.*)$ /$1 break;
    proxy_pass $itunes_upstream;
    proxy_set_header Host audio-ssl.itunes.apple.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_ssl_server_name on;
    # 音频文件较大，透传 Range 以便浏览器按需分段请求
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    expires 7d;
  }

  # Audius 免费完整曲库 JSON 接口同源代理（音乐馆默认曲库来源）
  # 对应 vite dev 代理 '/audius-api'：/audius-api/v1/xxx → api.audius.co/v1/xxx
  location /audius-api/ {
    set $audius_upstream https://api.audius.co;
    rewrite ^/audius-api/(.*)$ /$1 break;
    proxy_pass $audius_upstream;
    proxy_set_header Host api.audius.co;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_ssl_server_name on;
    proxy_read_timeout 30s;
  }
}
